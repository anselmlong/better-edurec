<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Primary" style="box-sizing: border-box; width: 100%; height: 100%; min-height: 900px; background: #FFFFFF; border-right: 1px solid #DCE1E7; display: flex; flex-direction: column; font-family: 'Public Sans', system-ui, sans-serif; color: #16202E">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 18px 18px; background: #123A6B; color: #FFFFFF; text-decoration: none">
    <span style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-weight: 700; font-size: 18px; letter-spacing: -0.01em">EduRec</span>
      <span style="font-size: 12px; color: #C9D6E6">Education Records System</span>
    </span>
  </a>
  <div style="padding: 16px 12px; display: flex; flex-direction: column; gap: 16px; flex: 1">
    <a href="Search.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 6px; background: #F5F7FA; border: 1px solid #DCE1E7; color: #5B6675; text-decoration: none; font-size: 14px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="flex: 1">Search</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 1px 5px; border: 1px solid #DCE1E7; border-radius: 4px; background: #FFFFFF">⌘K</span>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="10">
        <a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
          <span style="flex: 1">{{item.label}}</span>
          <sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{ false }}">
            <span style="{{item.badgeStyle}}">{{item.badge}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>
    <div style="flex: 1"></div>
    <a href="Profile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid #DCE1E7; text-decoration: none; color: #16202E">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #E5EEF8; color: #123A6B; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">RT</span>
      <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
        <span style="font-weight: 600; font-size: 14px">Rachel Tan</span>
        <span style="font-size: 12px; color: #5B6675; font-family: 'IBM Plex Mono', monospace">A0251234X</span>
      </span>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","timetable","results","degree","exams","coursereg","money","documents","exchange","profile"],"default":"today"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const defs = [
      { id: 'today', label: 'Overview', href: 'Main.dc.html', icon: 'M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
      { id: 'timetable', label: 'Courses & timetable', href: 'Timetable.dc.html', icon: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4' },
      { id: 'results', label: 'Results', href: 'Results.dc.html', icon: 'M5 20V11M12 20V5M19 20v-6' },
      { id: 'degree', label: 'Degree progress', href: 'Degree.dc.html', icon: 'M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5' },
      { id: 'exams', label: 'Examinations', href: 'Exams.dc.html', icon: 'M8 3h8v3H8zM6 4.5H5V21h14V4.5h-1M9 11h6M9 15h4', badge: '4' },
      { id: 'coursereg', label: 'Course registration', href: 'CourseReg.dc.html', icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM16.5 13v7M13 16.5h7', badge: '17 Nov' },
      { id: 'money', label: 'Finances', href: 'Money.dc.html', icon: 'M3 7h18v12H3zM3 11h18M7 15h3' },
      { id: 'documents', label: 'Documents & requests', href: 'Documents.dc.html', icon: 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6' },
      { id: 'exchange', label: 'Global education', href: 'Exchange.dc.html', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18' },
      { id: 'profile', label: 'Personal information', href: 'Profile.dc.html', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-4 4-6 8-6s7 2 8 6' }
    ];
    const items = defs.map((d) => {
      const on = d.id === active;
      return {
        ...d,
        current: on ? 'page' : 'false',
        hasBadge: !!d.badge,
        style: 'display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:' + (on ? '600' : '500') + ';background:' + (on ? '#E5EEF8' : 'transparent') + ';color:' + (on ? '#123A6B' : '#34404F'),
        badgeStyle: 'font-family:IBM Plex Mono,monospace;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:#FDEBE1;color:#9A3F00'
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
