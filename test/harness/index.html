<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../../src/theme.css">
<style>
  .fake { font: 13px Arial, sans-serif; padding: 16px; }
  .fake .ps_header { background: #fff; padding: 12px; }
  .fake .tile { display: inline-block; width: 160px; height: 120px; margin: 4px; background: #f0a060; color: #fff; padding: 8px; }
</style>
</head>
<body>
<!-- Fake EduRec pages with invented data, laid out like PeopleSoft (one text node per element). -->
<script>
  const PAGES = {
    home: { url: '/psc/cs90prd_2/EMPLOYEE/SA/c/NUI_FRAMEWORK.PT_LANDINGPAGE.GBL?lp=SA.EMPLOYEE.DEFAULT_LP', lines: [] },
    results: {
      url: '/psc/cs90prd_17/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_AD_REG_NAVCOL_FL.GBL?GComp=N_SS_EXAMINATNS_FL',
      lines: ['My Exam Results', '2025/2026 Semester 2', 'National University of Singapore', 'Undergraduate', 'Course Grades', 'Course', 'Description', 'Units Taken', 'Grade',
        'CS2102', 'DATABASE SYSTEMS', '4.00', 'A-', 'CS3210', 'PARALLEL COMPUTING', '4.00', 'A-', 'CS3235', 'COMPUTER SECURITY', '4.00', 'B+', 'CS4244', 'KNOWLEDGE REPRESENTATION AND REASONING', '4.00', 'A', 'CFG2002', 'CAREER CREATION', '2.00', 'CS',
        'Program - Bachelor of Computing', 'Earned graded units in GPA', '16.00', '96.00', 'Earned graded units not in GPA', '2.00', '28.00', 'GPA', '4.43', 'Academic Standing Status', 'Passed/Proceed', 'Important Notes:']
    },
    audit: {
      url: '/psc/cs90prd_11/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_AD_REG_NAVCOL_FL.GBL?GComp=N_CC_ACAD_ADVIS_FL',
      lines: ['My Academics', 'My Graduation Audit Report', 'NUS | Undergraduate', 'Graduation check outcome:', 'Not Satisfied',
        'CS Breadth & Depth', 'Not Satisfied:   Pass 32 Units of level-3000+ CS courses.', 'Units: 32.00 required, 28.00 taken, 4.00 needed',
        'UE Requirements', 'Not Satisfied:   Pass 40 Units of Unrestricted Elective Courses.', 'Units: 40.00 required, 28.00 taken, 12.00 needed',
        'Pass 40 UTs of UEs.', 'Not Satisfied:   >', 'Units: 40.00 required, 28.00 taken, 12.00 needed',
        'Overall Requirements', 'Not Satisfied:   >', 'Overall UT Requirement', 'Not Satisfied:   Verify overall minimum 160 Units for the degree.', 'Units: 160.00 required, 144.00 taken, 16.00 needed']
    },
    classes: {
      url: '/psc/cs90prd_52/EMPLOYEE/SA/c/N_STUDENT_RECORDS.N_MRS_START_MD_FL.GBL?GComp=N_MRS_START_NAV_FL',
      lines: ['View My Classes@CourseReg', 'Undergraduate', '2026/2027 Semester 1', 'CS3223 Database Systems Implementation', 'Class', 'Class Type', 'Session', 'Units', 'Status',
        'L - L1 - 13001', 'Lecture', 'Regular', '4.00', 'Enrolled', 'T - T04 - 13002', 'Tutorial', 'Regular', 'Enrolled',
        'PH2202 Philosophy of Mind', 'Class', 'Class Type', 'L - L1 - 22001', 'Lecture', 'Regular', '4.00', 'Enrolled']
    },
    finaid: {
      url: '/psc/cs90prd_41/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_SF_FA_DISB_FL.GBL',
      lines: ['View Financial Aid Disbursed', 'GO', '2 rows', 'FA Code', 'FA Type', 'Item Type', 'Term', 'Posted Date', 'Amount',
        '1', 'Example Merit Award', 'Third Party Contracts', 'Example Merit Award', '2025/2026 Semester 2', '13/01/2026', '3850.00',
        '2', 'Example Merit Award', 'Third Party Contracts', 'Example Merit Award', '2026/2027 Semester 1', '11/08/2026', '3850.00']
    }
  };
  // Fake View Classes pages, generated around today so the live timetable has data.
  (function () {
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const mon = new Date(); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    const plan = [[0,'10:00AM','AB 1001  Lecture','LT1'],[1,'2:00PM','CD 2002  Tutorial','COM1-02'],[2,'9:00AM','AB 1001  Lecture','LT1'],[2,'4:00PM','EF 3003  Laboratory','LAB-3'],[3,'12:00PM','CD 2002  Lecture','LT19'],[4,'10:00AM','EF 3003  Lecture','LT7']];
    const byDate = ['2026/2027 Semester 1','By Class','By Date','From','To','Please note that there will be no classes on public holidays.'];
    for (const [d, t, c, r] of plan) {
      const day = new Date(mon); day.setDate(mon.getDate() + d);
      byDate.push(DAYS[day.getDay()] + ' ' + MONTHS[day.getMonth()] + ' ' + day.getDate(), t, c, 'Room: ' + r, 'Status: Enrolled');
    }
    PAGES.schedule = { url: '/psc/cs90prd_37/EMPLOYEE/SA/c/SSR_STUDENT_ACAD_REC_FL.SSR_MD_ACAD_REC_FL.GBL?GComp=SSR_SP_ACAD_REC_FL', lines: byDate };
    PAGES.slots = { url: PAGES.schedule.url, lines: ['2026/2027 Semester 1','By Class','By Date','Please note that there will be no classes on public holidays.',
      'AB 1001   Example Course A','Days: Monday','Times: 10:00AM to 12:00PM','Days: Wednesday','Times: 9:00AM to 11:00AM',
      'CD 2002   Example Course B','Days: Tuesday','Times: 2:00PM to 3:00PM','Days: Thursday','Times: 12:00PM to 2:00PM',
      'EF 3003   Example Course C','Days: Wednesday','Times: 4:00PM to 6:00PM','Days: Friday','Times: 10:00AM to 12:00PM'] };
  })();
  const key = new URLSearchParams(location.search).get('page') || 'home';
  const page = PAGES[key];

  const form = document.createElement('form');
  form.className = 'PSForm fake';
  const header = document.createElement('div');
  header.id = 'PT_HEADER';
  header.className = 'ps_header';
  header.textContent = 'PeopleSoft header';
  form.append(header);
  if (key === 'home') {
    for (const t of ['Announcements', 'Personal Info', 'Academics', 'Financials']) {
      const d = document.createElement('div'); d.className = 'tile nuitile'; d.textContent = t; form.append(d);
    }
  } else {
    // Mimic EduRec's Fluid frame: header with a back slot, page list, content.
    header.textContent = '';
    const slot = document.createElement('div'); slot.id = 'win0hdrdivPT_NAV_CONT'; slot.className = 'ps_back_cont';
    const back = document.createElement('div'); back.className = 'ps_button_backnav';
    back.innerHTML = '<a class="ps-button" href="#"><span class="ps-text">Fieldwork Management System</span></a>';
    slot.append(back); header.append(slot);
    const mid = document.createElement('div'); mid.id = 'PT_MID_SECTION'; mid.style.display = 'flex';
    const side = document.createElement('div'); side.id = 'PT_SIDE'; side.style.cssText = 'width:260px;flex:none';
    side.innerHTML = '<ul class="psa_list-linkmenu"><li class="psc_selected"><a class="ps-link"><span class="ps-text">View Exam Results</span></a></li><li><a class="ps-link"><span class="ps-text">View Exam Schedule</span></a></li></ul>';
    const content = document.createElement('div'); content.id = 'PT_CONTENT'; content.style.flex = '1';
    // EduRec puts each page's lines inside a grid box, which the restyle draws as a card.
    const main = document.createElement('div'); main.id = 'PT_MAIN';
    const apps = document.createElement('div'); apps.className = 'ps_apps_content';
    const grid = document.createElement('div'); grid.className = 'ps_box-grid-flex';
    const box = document.createElement('div');
    box.className = 'ps_box-group';
    for (const l of page.lines) { const d = document.createElement('div'); d.textContent = l; box.append(d); }
    grid.append(box); apps.append(grid); main.append(apps); content.append(main); mid.append(side, content); form.append(mid);
  }
  document.body.append(form);

  // In-memory chrome.storage stub that persists across harness pages via localStorage.
  const mem = JSON.parse(localStorage.getItem('edr-harness') || '{}');
  const listeners = [];
  window.chrome = { runtime: { id: 'harness' }, storage: {
    local: {
      async get(keys) { const ks = [].concat(keys); return Object.fromEntries(ks.filter((k) => k in mem).map((k) => [k, mem[k]])); },
      async set(obj) {
        const changes = {};
        for (const [k, v] of Object.entries(obj)) { changes[k] = { newValue: v }; mem[k] = v; }
        localStorage.setItem('edr-harness', JSON.stringify(mem));
        listeners.forEach((fn) => fn(changes, 'local'));
      },
      async remove(k) {
        const changes = {};
        for (const key of [].concat(k)) { changes[key] = { oldValue: mem[key] }; delete mem[key]; }
        localStorage.setItem('edr-harness', JSON.stringify(mem));
        listeners.forEach((fn) => fn(changes, 'local'));
      }
    },
    onChanged: { addListener(fn) { listeners.push(fn); } }
  } };
  window.HARNESS_URL = 'https://myedurec.nus.edu.sg' + page.url;
</script>
<script src="../../src/boot.js"></script>
<script src="../../src/core.js"></script>
<script src="../../src/routes.js"></script>
<script>
  // Pretend to be on the EduRec page under test.
  const realDetect = EDR.routes.detectPage;
  EDR.routes.detectPage = () => realDetect(window.HARNESS_URL);
  // ?embed runs the full shell inside an iframe (the landing page's live demo).
  if (new URLSearchParams(location.search).has('embed')) EDR.isTop = true;
</script>
<script src="../../src/parsers.js"></script>
<script src="../../src/store.js"></script>
<script>
  // ?noseen keeps a guide step waiting so its coach card can be inspected.
  if (new URLSearchParams(location.search).has('noseen')) EDR.store.getSeen = async () => ({});
</script>
<script src="../../src/themes.js"></script>
<script src="../../src/keys.js"></script>
<script src="../../src/timetable.js"></script>
<script src="../../src/guide.js"></script>
<script src="../../src/shell.js"></script>
<script src="../../src/overview.js"></script>
<script src="../../src/enhancers.js"></script>
<script src="../../src/main.js"></script>
</body>
</html>
