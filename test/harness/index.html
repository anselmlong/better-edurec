<body>
<!-- Fake EduRec pages with invented data, laid out like PeopleSoft (one text node per element). -->
<script>
  const PAGES = {
    home: { url: '/psc/cs90prd_2/EMPLOYEE/SA/c/NUI_FRAMEWORK.PT_LANDINGPAGE.GBL?lp=SA.EMPLOYEE.DEFAULT_LP', lines: [] },
    results: {
      url: '/psc/cs90prd_17/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_AD_REG_NAVCOL_FL.GBL?GComp=N_SS_EXAMINATNS_FL',
      lines: ['My Exam Results', '2025/2026 Semester 2', 'National University of Singapore', 'Undergraduate', 'Course Grades', 'Course', 'Description', 'Units Taken', 'Grade',
        'CS2102', 'DATABASE SYSTEMS', '4.00', 'A-', 'CS3210', 'PARALLEL COMPUTING', '4.00', 'A-', 'CS3235', 'COMPUTER SECURITY', '4.00', 'B+', 'CS4244', 'KNOWLEDGE REPRESENTATION AND REASONING', '4.00', 'A', 'CFG2002', 'CAREER CREATION', '2.00', 'CS',
        'Program - Bachelor of Computing', 'Earned graded units in GPA', '16.00', '96.00', 'Earned graded units not in GPA', '2.00', '28.00', 'GPA', '4.43', 'Academic Standing Status', 'Passed/Proceed', 'Important Notes:']
    },
    audit: {
      url: '/psc/cs90prd_11/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_AD_REG_NAVCOL_FL.GBL?GComp=N_CC_ACAD_ADVIS_FL',
      lines: ['My Academics', 'My Graduation Audit Report', 'NUS | Undergraduate', 'Graduation check outcome:', 'Not Satisfied',
        'CS Breadth & Depth', 'Not Satisfied:   Pass 32 Units of level-3000+ CS courses.', 'Units: 32.00 required, 28.00 taken, 4.00 needed',
        'UE Requirements', 'Not Satisfied:   Pass 40 Units of Unrestricted Elective Courses.', 'Units: 40.00 required, 28.00 taken, 12.00 needed',
        'Pass 40 UTs of UEs.', 'Not Satisfied:   >', 'Units: 40.00 required, 28.00 taken, 12.00 needed',
        'Overall Requirements', 'Not Satisfied:   >', 'Overall UT Requirement', 'Not Satisfied:   Verify overall minimum 160 Units for the degree.', 'Units: 160.00 required, 144.00 taken, 16.00 needed']
    },
    classes: {
      url: '/psc/cs90prd_52/EMPLOYEE/SA/c/N_STUDENT_RECORDS.N_MRS_START_MD_FL.GBL?GComp=N_MRS_START_NAV_FL',
      lines: ['View My Classes@CourseReg', 'Undergraduate', '2026/2027 Semester 1', 'CS3223 Database Systems Implementation', 'Class', 'Class Type', 'Session', 'Units', 'Status',
        'L - L1 - 13001', 'Lecture', 'Regular', '4.00', 'Enrolled', 'T - T04 - 13002', 'Tutorial', 'Regular', 'Enrolled',
        'PH2202 Philosophy of Mind', 'Class', 'Class Type', 'L - L1 - 22001', 'Lecture', 'Regular', '4.00', 'Enrolled']
    },
    finaid: {
      url: '/psc/cs90prd_41/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_SF_FA_DISB_FL.GBL',
      lines: ['View Financial Aid Disbursed', 'GO', '2 rows', 'FA Code', 'FA Type', 'Item Type', 'Term', 'Posted Date', 'Amount',
        '1', 'Example Merit Award', 'Third Party Contracts', 'Example Merit Award', '2025/2026 Semester 2', '13/01/2026', '3850.00',
        '2', 'Example Merit Award', 'Third Party Contracts', 'Example Merit Award', '2026/2027 Semester 1', '11/08/2026', '3850.00']
    }
  };
  // Fake View Classes pages, generated around today so the live timetable has data.
  (function () {
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const mon = new Date(); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
    const plan = [[0,'10:00AM','AB 1001  Lecture','LT1'],[1,'2:00PM','CD 2002  Tutorial','COM1-02'],[2,'9:00AM','AB 1001  Lecture','LT1'],[2,'4:00PM','EF 3003  Laboratory','LAB-3'],[3,'12:00PM','CD 2002  Lecture','LT19'],[4,'10:00AM','EF 3003  Lecture','LT7']];
    const byDate = ['2026/2027 Semester 1','By Class','By Date','From','To','Please note that there will be no classes on public holidays.'];
    for (const [d, t, c, r] of plan) {
      const day = new Date(mon); day.setDate(mon.getDate() + d);
      byDate.push(DAYS[day.getDay()] + ' ' + MONTHS[day.getMonth()] + ' ' + day.getDate(), t, c, 'Room: ' + r, 'Status: Enrolled');
    }
    PAGES.schedule = { url: '/psc/cs90prd_37/EMPLOYEE/SA/c/SSR_STUDENT_ACAD_REC_FL.SSR_MD_ACAD_REC_FL.GBL?GComp=SSR_SP_ACAD_REC_FL', lines: byDate };
    PAGES.slots = { url: PAGES.schedule.url, lines: ['2026/2027 Semester 1','By Class','By Date','Please note that there will be no classes on public holidays.',
      'AB 1001   Example Course A','Days: Monday','Times: 10:00AM to 12:00PM','Days: Wednesday','Times: 9:00AM to 11:00AM',
      'CD 2002   Example Course B','Days: Tuesday','Times: 2:00PM to 3:00PM','Days: Thursday','Times: 12:00PM to 2:00PM',
      'EF 3003   Example Course C','Days: Wednesday','Times: 4:00PM to 6:00PM','Days: Friday','Times: 10:00AM to 12:00PM'] };
  })();
  // Form controls, messages and a classic (non-Fluid) page. The markup is approximated
  // from PeopleSoft's Fluid and classic class names, not copied from EduRec.
  PAGES.controls = { url: '/psc/cs90prd_41/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_SF_FA_DISB_FL.GBL', html: `
    <h1 id="PANEL_TITLE"><span class="ps-text">Apply Official Transcript</span></h1>
    <div class="ps_box-longedit psc_label-none"><div class="ps_box-value">Official transcripts are issued as a PDF and sent to the email address in your profile. Requests made after 5pm are processed the next working day. If you need a printed copy for a scholarship or visa application, choose the printed option and allow five working days for delivery. Transcripts for students with outstanding fees are held until the fees are paid.</div></div>
    <div class="ps_box-group psc_layout">
      <div class="ps_box-dropdown"><div class="ps_box-label"><label class="ps-label" for="rt">Report Type</label></div>
        <div class="ps_box-control"><select id="rt" class="ps-dropdown"><option>Undergraduate Transcript</option><option>Graduate Transcript</option></select></div></div>
      <div class="ps_box-edit"><div class="ps_box-label"><label class="ps-label" for="cp">Copies</label></div>
        <div class="ps_box-control"><input id="cp" class="ps-edit" type="text" value="1"></div></div>
      <div class="ps_box-edit"><div class="ps_box-label"><label class="ps-label" for="em">Send to</label></div>
        <div class="ps_box-control"><input id="em" class="ps-edit" type="text" placeholder="name@u.nus.edu"></div></div>
      <div class="ps_box-edit"><div class="ps_box-label"><label class="ps-label" for="ro">Student ID</label></div>
        <div class="ps_box-control"><input id="ro" class="ps-edit" type="text" value="A0000000X" disabled></div></div>
      <div class="ps_box-radio"><input class="ps-radio" type="radio" name="v" id="v1" checked><label class="ps-label" for="v1">By Class</label>
        <input class="ps-radio" type="radio" name="v" id="v2"><label class="ps-label" for="v2">By Date</label></div>
      <div class="ps_box-checkbox"><input class="ps-checkbox" type="checkbox" id="at" checked><label class="ps-label" for="at">All Terms</label></div>
      <div class="ps_box-longedit"><div class="ps_box-label"><label class="ps-label" for="pu">Purpose</label></div>
        <div class="ps_box-control"><textarea id="pu" class="ps-edit" rows="3"></textarea></div></div>
      <div class="ps_box-button psc_primary"><span class="ps-button-wrapper"><a class="ps-button" href="#">Submit</a></span></div>
      <div class="ps_box-button"><span class="ps-button-wrapper"><a class="ps-button" href="#">Cancel</a></span></div>
      <input type="button" class="ps-button" value="GO">
    </div>
    <div id="alertmsg" class="ps_alert">You are not eligible for commencement registration !</div>` };
  PAGES.classic = { url: '/psc/cs90prd_11/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.SAA_SS_DPR_ADB.GBL', html: `
    <div class="PAPAGETITLE">Academic Advisement Report</div>
    <span class="PSEDITBOXLABEL">Report Date</span> <span class="PSEDITBOX_DISPONLY">20/10/2026</span>
    <span class="PSDROPDOWNLABEL">Career</span> <select class="PSDROPDOWNLIST"><option>Undergraduate</option></select>
    <input type="text" class="PSEDITBOX" value="0300CSHON"> <input type="button" class="PSPUSHBUTTON" value="Expand All">
    <table class="PSLEVEL1GRIDWBO" style="margin-top:12px;width:100%"><tr><td class="PSLEVEL1GRIDNAVIGATIONBAR" colspan="3">Course List &nbsp; <a class="PSHYPERLINK" href="#">First</a> 1-3 of 9 <a class="PSHYPERLINK" href="#">Last</a></td></tr>
      <tr><th class="PSLEVEL1GRIDCOLUMNHDR">Course</th><th class="PSLEVEL1GRIDCOLUMNHDR">Description</th><th class="PSLEVEL1GRIDCOLUMNHDR">Units</th></tr>
      <tr><td class="PSLEVEL1GRIDODDROW">CS2105</td><td class="PSLEVEL1GRIDODDROW">Introduction to Computer Netwo</td><td class="PSLEVEL1GRIDODDROW">4.00</td></tr>
      <tr><td class="PSLEVEL1GRIDEVENROW">CS2106</td><td class="PSLEVEL1GRIDEVENROW">Introduction to Operating Syst</td><td class="PSLEVEL1GRIDEVENROW">4.00</td></tr>
      <tr><td class="PSLEVEL1GRIDODDROW">CS3230</td><td class="PSLEVEL1GRIDODDROW">Design and Analysis of Algorit</td><td class="PSLEVEL1GRIDODDROW">4.00</td></tr></table>
    <table class="PSLEVEL1GRIDWBO" style="margin-top:16px;width:100%"><tr><td class="PSLEVEL1GRIDNAVIGATIONBAR" colspan="13">External Study Applications &nbsp; 1-1 of 1</td></tr>
      <tr>${['Application', 'Term', 'Host University', 'Country', 'Programme', 'Status', 'Status Date', 'Units', 'Mapped', 'Possible Actions 1', 'Possible Actions 2', 'Possible Actions 3', 'Remarks'].map((t) => '<th class="PSLEVEL1GRIDCOLUMNHDR">' + t + '</th>').join('')}</tr>
      <tr>${['0001234', '2610', 'Example University', 'Example Country', 'Student Exchange Programme', 'Ext Study Accepted by Host', '02/09/2026', '20.00', 'Yes', 'NA', 'NA', 'NA', 'Awaiting module approval'].map((t) => '<td class="PSLEVEL1GRIDODDROW">' + t + '</td>').join('')}</tr></table>` };
  // A filter row above a grid, and an instruction wall above two buttons.
  const P = (t) => '<p>' + t + '</p>';
  PAGES.filters = { url: '/psc/cs90prd_41/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_SF_FA_DISB_FL.GBL', html: `
    <h1 id="PANEL_TITLE"><span class="ps-text">View Financial Aid Disbursed</span></h1>
    <div class="ps_box-group psc_layout">
      <div class="ps_box-checkbox"><input class="ps-checkbox" type="checkbox" id="fat" checked><label class="ps-label" for="fat">All Terms</label></div>
      <div class="ps_box-dropdown"><div class="ps_box-label"><label class="ps-label" for="tf">Term From</label></div><div class="ps_box-control"><select id="tf" class="ps-dropdown"><option>2025/2026 Semester 1</option></select></div></div>
      <div class="ps_box-dropdown"><div class="ps_box-label"><label class="ps-label" for="tt">Term To</label></div><div class="ps_box-control"><select id="tt" class="ps-dropdown"><option>2026/2027 Semester 1</option></select></div></div>
      <div class="ps_box-button psc_primary"><a class="ps-button" href="#">GO</a></div>
    </div>
    <div class="ps_box-grid-flex"><div class="ps_box-grid-header"><span class="ps_grid-title">Disbursements</span></div><div class="ps_box-gridc"><table class="ps_grid-flex">
      <tr class="ps_grid-head-row"><th class="ps_grid-col"><span class="ps_grid-col-label">Term</span></th><th class="ps_grid-col"><span class="ps_grid-col-label">Posted</span></th><th class="ps_grid-col psc_num"><span class="ps_grid-col-label">Amount</span></th></tr>
      <tr class="ps_grid-row"><td class="ps_grid-cell"><span class="ps_box-value">2025/2026 Semester 2</span></td><td class="ps_grid-cell"><span class="ps_box-value">13/01/2026</span></td><td class="ps_grid-cell psc_num"><span class="ps_box-value">3,850.00</span></td></tr>
      <tr class="ps_grid-row"><td class="ps_grid-cell"><span class="ps_box-value">2026/2027 Semester 1</span></td><td class="ps_grid-cell"><span class="ps_box-value">11/08/2026</span></td><td class="ps_grid-cell psc_num"><span class="ps_box-value">3,850.00</span></td></tr>
    </table></div></div>` };
  PAGES.notes = { url: '/psc/cs90prd_17/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_AD_REG_NAVCOL_FL.GBL', html: `
    <h1 id="PANEL_TITLE"><span class="ps-text">Access Special Consideration</span></h1>
    <div class="ps_box-longedit psc_label-none"><div class="ps_box-value">`
      + P('1. Special consideration is for students whose examination performance was affected by illness or other circumstances beyond their control during the examination period.')
      + P('2. Applications must be submitted within three working days of the affected examination, together with supporting documents such as a medical certificate.')
      + P('3. Medical certificates must state the dates of incapacity and be issued by a registered medical practitioner. Certificates issued after the examination date may not be accepted.')
      + P('4. Approval is not automatic. The Board of Examiners decides each case, and may offer a make-up examination or other arrangements.')
      + P('5. Submitting false information is a disciplinary offence.')
      + P('6. Questions about an application go to your faculty office, not the Registrar.') + `</div></div>
    <div class="ps_box-button psc_primary"><a class="ps-button" href="#">Apply</a></div>
    <div class="ps_box-button"><a class="ps-button" href="#">View my applications</a></div>` };
  const key = new URLSearchParams(location.search).get('page') || 'home';
  const page = PAGES[key];

  const form = document.createElement('form');
  form.className = 'PSForm fake';
  const header = document.createElement('div');
  header.id = 'PT_HEADER';
  header.className = 'ps_header';
  header.textContent = 'PeopleSoft header';
  form.append(header);
  if (key === 'home') {
    for (const t of ['Announcements', 'Personal Info', 'Academics', 'Financials']) {
      const d = document.createElement('div'); d.className = 'tile nuitile'; d.textContent = t; form.append(d);
    }
  } else {
    // Mimic EduRec's Fluid frame: header with a back slot, page list, content.
    header.textContent = '';
    const slot = document.createElement('div'); slot.id = 'win0hdrdivPT_NAV_CONT'; slot.className = 'ps_back_cont';
    const back = document.createElement('div'); back.className = 'ps_button_backnav';
    back.innerHTML = '<a class="ps-button" href="#"><span class="ps-text">Fieldwork Management System</span></a>';
    slot.append(back); header.append(slot);
    const mid = document.createElement('div'); mid.id = 'PT_MID_SECTION'; mid.style.display = 'flex';
    const side = document.createElement('div'); side.id = 'PT_SIDE'; side.style.cssText = 'width:260px;flex:none';
    side.innerHTML = '<ul class="psa_list-linkmenu"><li class="psc_selected"><a class="ps-link"><span class="ps-text">View Exam Results</span></a></li><li><a class="ps-link"><span class="ps-text">View Exam Schedule</span></a></li></ul>';
    const content = document.createElement('div'); content.id = 'PT_CONTENT'; content.style.flex = '1';
    // EduRec puts each page's lines inside a grid box, which the restyle draws as a card.
    const main = document.createElement('div'); main.id = 'PT_MAIN';
    const apps = document.createElement('div'); apps.className = 'ps_apps_content';
    const grid = document.createElement('div'); grid.className = 'ps_box-grid-flex';
    const box = document.createElement('div');
    box.className = 'ps_box-group';
    if (page.html) apps.innerHTML = page.html;
    else {
      for (const l of page.lines) { const d = document.createElement('div'); d.textContent = l; box.append(d); }
      grid.append(box); apps.append(grid);
    }
    main.append(apps); content.append(main); mid.append(side, content); form.append(mid);
  }
  // ?modal shows a blocking PeopleSoft dialog over the page.
  if (new URLSearchParams(location.search).has('modal')) {
    const mask = document.createElement('div'); mask.id = 'pt_modalMask';
    mask.style.cssText = 'position:fixed;inset:0;background:#000;opacity:.4;z-index:1000';
    const dlg = document.createElement('div'); dlg.className = 'ps_modal_container'; dlg.setAttribute('role', 'dialog');
    dlg.style.cssText = 'position:fixed;top:160px;left:50%;transform:translateX(-50%);width:460px;z-index:1001;background:#fff;border:1px solid #888';
    dlg.innerHTML = '<div class="ps_modal_header"><span class="ps_modal_title">Leave of Absence</span><a class="ps_modal_close" href="#" aria-label="Close">×</a></div>'
      + '<div class="ps_modal_content"><div id="alertmsg">Your application cannot be submitted online during the examination period. Please contact your faculty office.</div>'
      + '<div class="ps_box-button psc_primary"><a class="ps-button" href="#">OK</a></div></div>';
    form.append(mask, dlg);
  }
  document.body.append(form);

  // In-memory chrome.storage stub that persists across harness pages via localStorage.
  const mem = JSON.parse(localStorage.getItem('edr-harness') || '{}');
  const listeners = [];
  window.chrome = { runtime: { id: 'harness' }, storage: {
    local: {
      async get(keys) { const ks = [].concat(keys); return Object.fromEntries(ks.filter((k) => k in mem).map((k) => [k, mem[k]])); },
      async set(obj) {
        const changes = {};
        for (const [k, v] of Object.entries(obj)) { changes[k] = { newValue: v }; mem[k] = v; }
        localStorage.setItem('edr-harness', JSON.stringify(mem));
        listeners.forEach((fn) => fn(changes, 'local'));
      },
      async remove(k) {
        const changes = {};
        for (const key of [].concat(k)) { changes[key] = { oldValue: mem[key] }; delete mem[key]; }
        localStorage.setItem('edr-harness', JSON.stringify(mem));
        listeners.forEach((fn) => fn(changes, 'local'));
      }
    },
    onChanged: { addListener(fn) { listeners.push(fn); } }
  } };
  window.HARNESS_URL = 'https://myedurec.nus.edu.sg' + page.url;
</script>

<script>
  // Pretend to be on the EduRec page under test.
  const realDetect = EDR.routes.detectPage;
  EDR.routes.detectPage = () => realDetect(window.HARNESS_URL);
  // ?embed runs the full shell inside an iframe (the landing page's live demo).
  if (new URLSearchParams(location.search).has('embed')) EDR.isTop = true;
</script>

  if (new URLSearchParams(location.search).has('noseen')) EDR.store.getSeen = async () => ({});
</script>
