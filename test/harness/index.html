  // Fake View Classes pages, generated around today so the live timetable has data.

  })();
  // Form controls, messages and a classic (non-Fluid) page. The markup is approximated
  // from PeopleSoft's Fluid and classic class names, not copied from EduRec.

      <div class="ps_box-radio"><input class="ps-radio" type="radio" name="v" id="v1" checked><label class="ps-label" for="v1">By Class</label>
        <input class="ps-radio" type="radio" name="v" id="v2"><label class="ps-label" for="v2">By Date</label></div>
      <div class="ps_box-checkbox"><input class="ps-checkbox" type="checkbox" id="at" checked><label class="ps-label" for="at">All Terms</label></div>
      <div class="ps_box-longedit"><div class="ps_box-label"><label class="ps-label" for="pu">Purpose</label></div>
        <div class="ps_box-control"><textarea id="pu" class="ps-edit" rows="3"></textarea></div></div>
      <div class="ps_box-button psc_primary"><span class="ps-button-wrapper"><a class="ps-button" href="#">Submit</a></span></div>
      <div class="ps_box-button"><span class="ps-button-wrapper"><a class="ps-button" href="#">Cancel</a></span></div>
      <input type="button" class="ps-button" value="GO">
    </div>
    <div id="alertmsg" class="ps_alert">You are not eligible for commencement registration !</div>` };
  PAGES.classic = { url: '/psc/cs90prd_11/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.SAA_SS_DPR_ADB.GBL', html: `
    <div class="PAPAGETITLE">Academic Advisement Report</div>
    <span class="PSEDITBOXLABEL">Report Date</span> <span class="PSEDITBOX_DISPONLY">20/10/2026</span>
    <span class="PSDROPDOWNLABEL">Career</span> <select class="PSDROPDOWNLIST"><option>Undergraduate</option></select>
    <input type="text" class="PSEDITBOX" value="0300CSHON"> <input type="button" class="PSPUSHBUTTON" value="Expand All">
    <table class="PSLEVEL1GRIDWBO" style="margin-top:12px;width:100%"><tr><td class="PSLEVEL1GRIDNAVIGATIONBAR" colspan="3">Course List &nbsp; <a class="PSHYPERLINK" href="#">First</a> 1-3 of 9 <a class="PSHYPERLINK" href="#">Last</a></td></tr>
      <tr><th class="PSLEVEL1GRIDCOLUMNHDR">Course</th><th class="PSLEVEL1GRIDCOLUMNHDR">Description</th><th class="PSLEVEL1GRIDCOLUMNHDR">Units</th></tr>
      <tr><td class="PSLEVEL1GRIDODDROW">CS2105</td><td class="PSLEVEL1GRIDODDROW">Introduction to Computer Netwo</td><td class="PSLEVEL1GRIDODDROW">4.00</td></tr>
      <tr><td class="PSLEVEL1GRIDEVENROW">CS2106</td><td class="PSLEVEL1GRIDEVENROW">Introduction to Operating Syst</td><td class="PSLEVEL1GRIDEVENROW">4.00</td></tr>
      <tr><td class="PSLEVEL1GRIDODDROW">CS3230</td><td class="PSLEVEL1GRIDODDROW">Design and Analysis of Algorit</td><td class="PSLEVEL1GRIDODDROW">4.00</td></tr></table>
    <table class="PSLEVEL1GRIDWBO" style="margin-top:16px;width:100%"><tr><td class="PSLEVEL1GRIDNAVIGATIONBAR" colspan="13">External Study Applications &nbsp; 1-1 of 1</td></tr>
      <tr>${['Application', 'Term', 'Host University', 'Country', 'Programme', 'Status', 'Status Date', 'Units', 'Mapped', 'Possible Actions 1', 'Possible Actions 2', 'Possible Actions 3', 'Remarks'].map((t) => '<th class="PSLEVEL1GRIDCOLUMNHDR">' + t + '</th>').join('')}</tr>

  const P = (t) => '<p>' + t + '</p>';

    <h1 id="PANEL_TITLE"><span class="ps-text">View Financial Aid Disbursed</span></h1>
    <div class="ps_box-group psc_layout">
      <div class="ps_box-checkbox"><input class="ps-checkbox" type="checkbox" id="fat" checked><label class="ps-label" for="fat">All Terms</label></div>
      <div class="ps_box-dropdown"><div class="ps_box-label"><label class="ps-label" for="tf">Term From</label></div><div class="ps_box-control"><select id="tf" class="ps-dropdown"><option>2025/2026 Semester 1</option></select></div></div>

      <tr class="ps_grid-row"><td class="ps_grid-cell"><span class="ps_box-value">2025/2026 Semester 2</span></td><td class="ps_grid-cell"><span class="ps_box-value">13/01/2026</span></td><td class="ps_grid-cell psc_num"><span class="ps_box-value">3,850.00</span></td></tr>
      <tr class="ps_grid-row"><td class="ps_grid-cell"><span class="ps_box-value">2026/2027 Semester 1</span></td><td class="ps_grid-cell"><span class="ps_box-value">11/08/2026</span></td><td class="ps_grid-cell psc_num"><span class="ps_box-value">3,850.00</span></td></tr>
    </table></div></div>` };
  PAGES.notes = { url: '/psc/cs90prd_17/EMPLOYEE/SA/c/SA_LEARNER_SERVICES.N_AD_REG_NAVCOL_FL.GBL', html: `
    <h1 id="PANEL_TITLE"><span class="ps-text">Access Special Consideration</span></h1>
    <div class="ps_box-longedit psc_label-none"><div class="ps_box-value">`
      + P('1. Special consideration is for students whose examination performance was affected by illness or other circumstances beyond their control during the examination period.')
      + P('2. Applications must be submitted within three working days of the affected examination, together with supporting documents such as a medical certificate.')
      + P('3. Medical certificates must state the dates of incapacity and be issued by a registered medical practitioner. Certificates issued after the examination date may not be accepted.')
      + P('4. Approval is not automatic. The Board of Examiners decides each case, and may offer a make-up examination or other arrangements.')
      + P('5. Submitting false information is a disciplinary offence.')
      + P('6. Questions about an application go to your faculty office, not the Registrar.') + `</div></div>
    <div class="ps_box-button psc_primary"><a class="ps-button" href="#">Apply</a></div>
    <div class="ps_box-button"><a class="ps-button" href="#">View my applications</a></div>` };
  // Examinations pages with EduRec's nesting: a term header with Change, then
  // separate grid boxes and note groups inside the page's own content box.
  const cell = (t) => '<td class="ps_grid-cell"><span class="ps_box-value">' + t + '</span></td>';
  const grid = (title, cols, rows) => '<div class="ps_box-grid-flex"><div class="ps_box-grid-header"><span class="ps_grid-title">' + title + '</span></div><div class="ps_box-gridc"><table class="ps_grid-flex">'
    + '<tr class="ps_grid-head-row">' + cols.map((c) => '<th class="ps_grid-col"><span class="ps_grid-col-label">' + c + '</span></th>').join('') + '</tr>'
    + rows.map((r) => '<tr class="ps_grid-row">' + r.map((c) => cell([].concat(c).map((x) => '<div>' + x + '</div>').join(''))).join('') + '</tr>').join('') + '</table></div></div>';
  const termHead = (term) => '<div class="ps_box-group ps_apps_pageheader"><div>Example Student</div><div class="ps_box-group"><span id="TERM_TBL_DESCR">' + term + '</span>'

  const soon = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return [d.getDate(), d.getMonth() + 1, d.getFullYear()].map((x, i) => i < 2 ? String(x).padStart(2, '0') : x).join('-'); };
  PAGES.examschedule = { url: PAGES.results.url, html: termHead('2026/2027 Semester 1')
    + '<div class="ps_box-group"><div class="ps_box-radio"><input class="ps-radio" type="radio" name="v" checked id="bc"><label class="ps-label" for="bc">By Class</label><input class="ps-radio" type="radio" name="v" id="bd"><label class="ps-label" for="bd">By Date</label></div></div>'
    + '<div class="ps_apps_content">'
    + grid('', ['Class', 'Description', 'Exam Mode', 'Exam Date', 'Schedule', 'Exam Venue', 'Exam Seat Nbr', '*E-Exam Tool'], [
      [['AB 2105-L2', '(1111)'], 'Introduction to Example Studie (L)', 'Closed Book (auth. materials)', soon(-2), '9:00AM - 11:00AM', 'HALL-A', '19', ''],
      [['CD 1001-L04', '(2222)'], 'Example Workshop (L)', 'TBA', 'TBA', 'TBA', '', '-', ''],

      [['GH 3230-L1', '(4444)'], 'Example Algorithms (L)', 'Open Book', soon(12), '1:00PM - 3:00PM', 'HALL-C', '112', '']])
    + grid('', ['', '*E-Exam Tool Description'], [['1', 'EXAMTOOL_ONE - Example Online Assessment']])
    + '<div class="ps_box-group">' + '<div>Note: The Exam Seat Number and Exam Venue will only be available nearer the start of the examinations.</div><div>Information shown on this page is generated on 27 Oct 2026 03:52 PM</div></div>'
    + '</div>' };
  PAGES.examsempty = { url: PAGES.results.url, html: termHead('2027/2028 Semester 1') + '<div class="ps_apps_content">' + note('An exam schedule is not available for this term.') + '</div>' };
  PAGES.suhistory = { url: PAGES.results.url, html: '<div class="ps_apps_content">'
    + '<div class="ps_box-longedit psc_label-none"><div class="ps_box-value"><div>Instructions:</div><div>The table below shows the course(s) that you had exercised the Satisfactory(S)/Unsatisfactory(U) option on for the past semesters/terms.</div></div></div>'
    + grid('Courses Declared S/U', ['Semester', 'Course Code', 'Title', 'S/U Grade', 'Original Grade', 'Number of Units'], [
      ['2024/2025 Semester 1', 'AB1101', 'Example Methods', 'S', 'B+', '4.00'],
      ['2025/2026 Semester 2', 'CD2218', 'Example Platforms for Business', 'S', 'B', '4.00']])

  PAGES.suclosed = { url: PAGES.results.url, html: '<div class="ps_apps_content"><div class="ps_box-group psc_halign-center"><div class="ps_box-htmlarea"><div class="ps-htmlarea"><b>The S/U Declaration System is currently unavailable. Please refer to the University timeline on the opening and closing of the S/U Declaration Period.</b></div></div></div></div>' };
  PAGES.specialcons = { url: PAGES.results.url, html: '<div class="ps_apps_content">'
    + '<div class="ps_box-group"><div class="ps_box-longedit psc_label-none"><div class="ps_box-label"><span class="ps-label">Instructions:</span></div><div class="ps_box-value">'
    + P('1. The system does not allow amendments to be made once an application is submitted.') + P('2. For help with an application, contact your faculty office.') + P('3. The outcome is made known upon results release.') + '</div></div></div>'
    + '<div class="ps_box-group psc_halign-center"><div class="ps_box-button"><span class="ps-button-wrapper"><a class="ps-button" href="#">View History / Past Submission</a></span></div>'
    + '<div class="ps_box-button"><span class="ps-button-wrapper"><a class="ps-button" href="#">Make Submission for Current Semester</a></span></div></div></div>' };
  // Academic Records pages with EduRec's nesting (crawled 27 Oct 2026, values invented).
  const ACAD = '/psc/cs90prd_58/EMPLOYEE/SA/c/SSR_STUDENT_ACAD_REC_FL.SSR_MD_ACAD_REC_FL.GBL?GComp=SSR_SP_ACAD_REC_FL';
  const ACAD_NAV = ['View Academic Programme', 'View Student Status Letter', 'View Courses', 'Term and Course Enrollment', 'View Classes', 'View Milestones',
    'View Transfer Credit Report', 'Apply for Leave of Absence', 'EP Eligibility Letter', 'Student Requests'];
  const acad = (sel, html) => ({ url: ACAD, nav: ACAD_NAV, sel, html });
  const val = (t, label) => '<div class="ps_box-edit' + (label ? '' : ' psc_label-hide') + '">' + (label ? '<div class="ps_box-label"><span class="ps-label">' + label + '</span></div>' : '') + '<span class="ps_box-value">' + t + '</span></div>';
  const lgrid = (cols, rows, title) => '<div class="ps_box-grid-flex"><div class="ps_box-grid-header"><div class="ps_box-grid-title">' + (title ? '<h2 class="ps_grid-title"><span class="ps-text">' + title + '</span></h2>' : '')
    + '<div class="ps_box-text psc_rowcount"><span class="ps-text">' + rows.length + (rows.length === 1 ? ' row' : ' rows') + '</span></div></div></div><div class="ps_box-gridc"><table class="ps_grid-flex">'
    + '<thead class="ps_grid-head"><tr class="ps_grid-head-row">' + cols.map((c) => '<th class="ps_grid-col"><div class="ps_box_grid-col"><a class="ps_grid-col-label">' + c + '</a></div></th>').join('') + '</tr></thead><tbody class="ps_grid-body">'
    + rows.map((r) => '<tr class="ps_grid-row">' + r.map((c) => '<td class="ps_grid-cell">' + [].concat(c).map((x) => val(x)).join('') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></div>';
  const group = (inner, cls) => '<div class="ps_box-group' + (cls ? ' ' + cls : '') + '">' + inner + '</div>';
  const pageHead = (bits) => '<div class="ps_box-group ps_apps_pageheader"><div>Example Student</div><div class="ps_box-group">' + bits.map((b) => '<div>' + b + '</div>').join('')
    + '<div class="ps_box-button"><a class="ps-button" id="DERIVED_ACRD_FL_SSR_CHANGE_TERM" href="#">Change</a></div></div></div>';
  const PROG_COLS = ['Career', 'Career Nbr', 'Program', 'Plan Type', 'Plan', 'Sub-Plan'];

  PAGES.statusletter = acad('View Student Status Letter', '<div class="ps_box-group"><div class="ps_box-group ps_box-title psa_pagetitle"><h1 class="ps_pagetitle"><span class="ps-text">Select A Program</span></h1></div></div>'
    + group('<div class="ps_box-htmlarea"><div class="ps-htmlarea"> </div></div>', 'psa_no-data-to-display')
    + group('<div class="ps_box-grid-list"><div class="ps_box-gridc"><div class="ps_box-grid"><div class="ps_grid-list"><ul class="ps_grid-body"><li class="ps_grid-row">'
      + '<div class="ps_box-link"><a class="ps-link" href="#">National University of Singapore</a></div>' + ['Undergraduate', 'Bachelor of Examples', 'Example Studies (Hons)'].map((t) => val(t)).join('')
      + '</li></ul></div></div></div></div>'));
  PAGES.courses = acad('View Courses', pageHead(['2025/2026 Semester 2', 'National University of Singapore', 'Undergraduate']) + '<div class="ps_apps_content">'
    + group(val('2025/2026 Semester 2 | Undergraduate | NUS'), 'psc_label-none') + group('<div class="ps_box-htmlarea"><div class="ps-htmlarea"> </div></div>')

    form.append(mask, dlg);
  }
  document.body.append(form);

  // In-memory chrome.storage stub that persists across harness pages via localStorage.
  const mem = JSON.parse(localStorage.getItem('edr-harness') || '{}');
  const listeners = [];
  window.chrome = { runtime: { id: 'harness' }, storage: {
    local: {
      async get(keys) { const ks = [].concat(keys); return Object.fromEntries(ks.filter((k) => k in mem).map((k) => [k, mem[k]])); },
      async set(obj) {
        const changes = {};
        for (const [k, v] of Object.entries(obj)) { changes[k] = { newValue: v }; mem[k] = v; }
        localStorage.setItem('edr-harness', JSON.stringify(mem));
        listeners.forEach((fn) => fn(changes, 'local'));
      },
      async remove(k) {
        const changes = {};
        for (const key of [].concat(k)) { changes[key] = { oldValue: mem[key] }; delete mem[key]; }
        localStorage.setItem('edr-harness', JSON.stringify(mem));
        listeners.forEach((fn) => fn(changes, 'local'));
      }
    },
    onChanged: { addListener(fn) { listeners.push(fn); } }
  } };
  window.HARNESS_URL = 'https://myedurec.nus.edu.sg' + page.url;
