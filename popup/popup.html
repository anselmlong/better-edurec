<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EduRec Reskin</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>EduRec Reskin</strong>
    <span>Unofficial · read-only</span>
  </header>
  <label class="row">
    <span>New EduRec view</span>
    <input id="enabled" type="checkbox" role="switch">
  </label>
  <section>
    <h2>Saved in this browser</h2>
    <ul id="saved"></ul>
    <button id="clear" type="button">Clear saved summaries</button>
  </section>
  <p class="fine">Summaries never leave this device. Reload EduRec after changing the view.</p>
  <script src="popup.js"></script>
</body>
</html>
