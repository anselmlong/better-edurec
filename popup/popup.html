<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Better EduRec</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Better EduRec</strong>
    <span>Unofficial · not affiliated with NUS</span>
  </header>
  <label class="row">
    <span>New EduRec view</span>
    <input id="enabled" type="checkbox" role="switch">
  </label>
  <label class="row">
    <span>Theme</span>
    <select id="theme" aria-label="Theme"></select>
  </label>
  <label class="row">
    <span>Use Overview as homepage</span>
    <input id="overviewHome" type="checkbox" role="switch">
  </label>
  <section>
    <h2>Saved in this browser</h2>
    <ul id="saved"></ul>
    <div class="btns">
      <button id="reprompt" type="button">Show setup prompt</button>
      <button id="clear" type="button">Clear summaries</button>
    </div>
  </section>
  <p class="fine">Summaries never leave this device. Reload EduRec after changing the view. <a href="../faq/faq.html" target="_blank">FAQ, privacy and disclaimer</a></p>
  <script src="../src/themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
